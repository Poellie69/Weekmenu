name: Weekmenu
version: "0.2.0"
slug: weekmenu
description: Plan meals Sunday to Saturday, import recipes from any site, and make one shopping list.
url: https://github.com/Poellie69/Weekmenu
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ports:
  3000/tcp: 8099
ports_description:
  3000/tcp: Weekmenu on its own address (needs a password)
ingress: true
ingress_port: 8099
panel_icon: mdi:silverware-fork-knife
panel_title: Weekmenu
map:
  - type: ssl
options:
  password: ""
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  password: password?
  ssl: bool
  certfile: str
  keyfile: str
